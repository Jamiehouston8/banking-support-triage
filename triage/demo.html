<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Banking Support Triage</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#16181d;--mute:#5d6470;--line:#e2e5ea;--ok:#127a3e;--okbg:#e5f5ec;--hum:#a4400f;--humbg:#fdeee4;--acc:#2754c5}
@media (prefers-color-scheme:dark){:root{--bg:#121418;--card:#1b1e24;--ink:#e8eaee;--mute:#9aa1ad;--line:#2c3038;--ok:#5fd08f;--okbg:#16301f;--hum:#f0a070;--humbg:#38220f;--acc:#7d9cf0}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}
main{max-width:760px;margin:0 auto;padding:28px 16px 60px}
h1{font-size:22px;margin:0 0 4px}p.sub{color:var(--mute);margin:0 0 20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
textarea{width:100%;min-height:70px;font:inherit;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);resize:vertical}
button{font:inherit;border:0;border-radius:8px;padding:9px 16px;background:var(--acc);color:#fff;cursor:pointer;margin-top:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.chips button{background:transparent;color:var(--acc);border:1px solid var(--line);padding:5px 10px;margin:0;font-size:13px}
.badge{display:inline-block;font-weight:600;padding:4px 10px;border-radius:999px;font-size:14px}
.auto{background:var(--okbg);color:var(--ok)}.human{background:var(--humbg);color:var(--hum)}
.row{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--line);font-size:14px}.row:last-child{border:0}
.lbl{color:var(--mute);font-size:12px;text-transform:uppercase;letter-spacing:.04em;margin:14px 0 6px}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:3px}.bar i{display:block;height:100%;background:var(--acc)}
.reply{white-space:pre-wrap;background:var(--bg);border-radius:8px;padding:12px;font-size:14px}
.muted{color:var(--mute);font-size:13px}
</style></head><body><main>
<h1>Banking Support Triage</h1>
<p class="sub">Type a customer message. The model works out what they need, then decides whether it's safe to answer automatically or must go to a person.</p>
<div class="card">
<textarea id="t" placeholder="e.g. how long until my card arrives?"></textarea>
<button id="go">Triage message</button>
<div class="chips" id="chips"></div>
</div>
<div id="out"></div>
</main>
<script>
const API=(window.TRIAGE_API||'').replace(/\/$/,'');
const ex=["how long until my card arrives?","there is a payment on my account I don't recognise","my card was stolen","why was I charged a fee for topping up?","can I get a spare card for my partner?","whats the weather like"];
const chips=document.getElementById('chips'),t=document.getElementById('t'),out=document.getElementById('out');
ex.forEach(e=>{const b=document.createElement('button');b.textContent=e;b.onclick=()=>{t.value=e;run()};chips.appendChild(b)});
document.getElementById('go').onclick=run;
t.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();run()}});
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const nice=s=>s.replace(/_/g,' ').replace(/\?$/,'');
async function run(){
  const text=t.value.trim(); if(!text) return;
  out.innerHTML='<div class="card muted">Thinking…</div>';
  const slow=setTimeout(()=>{out.innerHTML='<div class="card muted">Waking the model up. The free server sleeps when nobody is using it, so the first message can take up to a minute…</div>'},4000);
  try{
    const r=await fetch(API+'/triage',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({text})});
    clearTimeout(slow); if(!r.ok) throw new Error(r.status);
    const d=await r.json(); const auto=d.decision==='auto_answer';
    out.innerHTML=`<div class="card">
      <span class="badge ${auto?'auto':'human'}">${auto?'✓ Answered automatically':'→ Sent to a person'}</span>
      <p class="muted" style="margin:8px 0 0">${esc(d.reason)} · ${d.latency_ms} ms</p>
      <div class="lbl">What the customer needs</div>
      ${d.top3.map(x=>`<div class="row"><span>${esc(nice(x.intent))}</span><span>${(x.p*100).toFixed(1)}%</span></div><div class="bar"><i style="width:${x.p*100}%"></i></div>`).join('')}
      <div class="lbl">Fraud / security risk</div>
      <div class="row"><span>Probability this is a fraud or security issue</span><span>${(d.fraud_risk*100).toFixed(1)}%</span></div>
      <div class="lbl">Help articles it found</div>
      ${d.retrieved.map(k=>`<div class="row"><span>${esc(k.id)} · ${esc(k.title)}</span><span class="muted">${k.score.toFixed(2)}</span></div>`).join('')}
      <div class="lbl">Reply</div>
      ${d.reply?`<div class="reply">${esc(d.reply)}</div><p class="muted">Source: ${d.citations.join(', ')}</p>`:'<p class="muted">No automatic reply. A person handles this one.</p>'}
    </div>`;
  }catch(e){clearTimeout(slow);out.innerHTML='<div class="card">Couldn\'t reach the service. Is it running?</div>'}
}
</script></body></html>
