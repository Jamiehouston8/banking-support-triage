name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - run: pip install -r requirements-ci.txt
      - run: pytest -q
  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t banking-support-triage .
      - name: smoke test the container
        run: |
          docker run -d -p 8000:8000 --name svc -e TRIAGE_DISABLE_LLM=1 banking-support-triage
          for i in $(seq 1 30); do curl -sf localhost:8000/health && break; sleep 2; done
          curl -sf -X POST localhost:8000/triage -H 'content-type: application/json' \
            -d '{"text":"how long until my card arrives?"}' | tee /dev/stderr | grep -q '"decision"'
